<% class=WebSignup %>
<% include=partials/top.part %>
<section class="panel narrow">
    <h1><%t.signup.title%></h1>
    <p class="lead"><%t.signup.lead%> <a href="/liquid/login.html"><%t.login.title%></a></p>
    <form method="post">
        <label><%t.field.name%><input type="text" name="fullName" value="<%fullName%>" autocomplete="name" required autofocus></label>
        <label><%t.field.email%><input type="email" name="email" value="<%email%>" autocomplete="username" required></label>
        <label><%passwordLabel%><input type="password" name="password" autocomplete="new-password" required></label>
        <button type="submit"><%t.signup.title%></button>
    </form>
</section>
<% include=partials/bottom.part %>
