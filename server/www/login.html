<% class=WebLogin %>
<% include=partials/top.part %>
<section class="panel narrow">
    <h1><%t.login.title%></h1>
    <p class="lead"><%t.login.lead%></p>
    <form method="post">
        <label><%t.field.email%><input type="email" name="email" value="<%email%>" autocomplete="username" required autofocus></label>
        <label><%t.login.password%><input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit"><%t.login.title%></button>
    </form>
    <p class="links"><a href="/liquid/signup.html"><%t.signup.title%></a></p>
</section>
<% include=partials/bottom.part %>
