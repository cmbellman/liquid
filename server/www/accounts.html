<% class=WebAccounts %>
<% include=partials/top.part %>
<section class="panel">
    <h1><%t.accounts.title%></h1>
    <table>
        <thead><tr><th><%t.reports.col.account%></th><th><%t.field.name%></th><th class="num"><%balanceTitle%></th></tr></thead>
        <tbody>
            <swe:iterator source="accounts"><tr><td><a href="/liquid/reports.html?report=ledger&amp;account=<%current.number%>"><%current.number%></a></td><td><%current.name%></td><td class="num"><%current.balance%></td></tr></swe:iterator>
        </tbody>
    </table>
</section>
<section class="panel">
    <h2><%t.accounts.add%></h2>
    <form method="post" class="grid">
        <label><%t.accounts.number%><input type="text" name="number" value="<%number%>" inputmode="numeric" pattern="[1-8][0-9]{3}" required></label>
        <label><%t.field.name%><input type="text" name="name" value="<%name%>" required></label>
        <div class="actions"><button type="submit"><%t.common.save%></button></div>
    </form>
</section>
<% include=partials/bottom.part %>
